<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">freeCodeCamp Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve the platform</p>
    <form id="survey-form">
      <label for="name" id="name-label">Name</label>
      <input type="text" id="name" placeholder="Enter your name" required><br>
      <label for="email" id="email-label">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required><br>
      <label for="number" id="number-label">Age(optional)</label>
      <input type="number" id="number" placeholder="Age" min="8" max="110"><br>
      <label for="dropdown">Which option best describes your current role?</label><br><br>
      <select id="dropdown">
        <option>Student</option>
        <option>Full time job</option>
        <option>Full time learner</option>
        <option>Prefer not to say</option>
        <option>other</option>
      </select><br>
      <p>Would you recommend freeCodeCamp to a friend?</p>
      <input id="yes-option" type="radio" name="hotel-stay" value="yes" />
          <label for="yes-option">Yes</label>
          <input id="no-option" type="radio" name="hotel-stay" value="no" />
          <label for="no-option">No</label><br>
          <p>What would you like to see improved? (Check all that apply)</p><br>
          <label for="front">Front-end Projects</label>
          <input type="checkbox" id="frond" value="front">
          <label for="back">Back-end Projects</label>
          <input type="checkbox" id="back" value="back">
          <label for="data">Data Visualization</label>
          <input type="checkbox" id="data" value="data"><br>
          <p>Any comments or suggestions?</p>
          <textarea cols="30" rows="10" name="comments" id="comments"></textarea><br>
          <button type="submit" id="submit">Submit</button>
    </form>
  </body>
</html>
